"components":
  "securitySchemes":
    "ServiceSession":
      "type": "http"
      "scheme": "bearer"
      "bearerFormat": "opaque service session"
  "schemas":
    "Category":
      "type": "string"
      "enum":
        - "movie"
        - "ott"
        - "game"
        - "epl"
    "Service":
      "type": "string"
      "enum":
        - "netflix"
        - "disney_plus"
        - "coupang_play"
        - "tving"
    "Device":
      "type": "string"
      "enum":
        - "pc"
        - "playstation"
        - "xbox"
        - "switch"
    "EventKind":
      "type": "string"
      "enum":
        - "theatrical_release"
        - "ott_season_premiere"
        - "game_release"
        - "epl_match"
    "Status":
      "type": "string"
      "enum":
        - "scheduled"
        - "postponed"
        - "cancelled"
    "Country":
      "type": "string"
      "pattern": "^[A-Z]{2}$"
      "description": "ISO 3166-1 alpha-2. 실제 지원 여부는 /catalog/options 확인"
    "TimeZone":
      "type": "string"
      "minLength": 1
      "maxLength": 100
      "example": "Asia/Seoul"
      "description": "서버가 지원하는 IANA 식별자. 임의 문자열/고정 UTC offset 거부"
    "InstantTime":
      "type": "object"
      "additionalProperties": false
      "properties":
        "type":
          "const": "instant"
        "instantUtc":
          "type": "string"
          "format": "date-time"
          "pattern": "Z$"
          "description": "UTC RFC 3339, Z 접미사"
        "sourceTimeZone":
          "anyOf":
            -
              "$ref": "#/components/schemas/TimeZone"
            -
              "type": "null"
        "displayDate":
          "type": "string"
          "format": "date"
        "displayTime":
          "type": "string"
          "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      "required":
        - "type"
        - "instantUtc"
        - "sourceTimeZone"
        - "displayDate"
        - "displayTime"
    "DateOnlyTime":
      "type": "object"
      "additionalProperties": false
      "properties":
        "type":
          "const": "date_only"
        "date":
          "type": "string"
          "format": "date"
      "required":
        - "type"
        - "date"
      "description": "지역 달력 날짜를 그대로 보존. UTC 자정을 합성하지 않는다."
    "UnknownTime":
      "type": "object"
      "additionalProperties": false
      "properties":
        "type":
          "const": "unknown"
        "announcedYear":
          "anyOf":
            -
              "type": "integer"
              "minimum": 1900
              "maximum": 9999
            -
              "type": "null"
        "announcedPeriod":
          "anyOf":
            -
              "type": "string"
              "maxLength": 100
            -
              "type": "null"
      "required":
        - "type"
        - "announcedYear"
        - "announcedPeriod"
      "description": "연도/월/분기 등 원문 요약. 날짜를 생성하지 않는다."
    "EventTime":
      "oneOf":
        -
          "$ref": "#/components/schemas/InstantTime"
        -
          "$ref": "#/components/schemas/DateOnlyTime"
        -
          "$ref": "#/components/schemas/UnknownTime"
      "discriminator":
        "propertyName": "type"
        "mapping":
          "instant": "#/components/schemas/InstantTime"
          "date_only": "#/components/schemas/DateOnlyTime"
          "unknown": "#/components/schemas/UnknownTime"
    "Team":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "name":
          "type": "string"
          "minLength": 1
      "required":
        - "id"
        - "name"
    "Match":
      "type": "object"
      "additionalProperties": false
      "properties":
        "competition":
          "const": "epl"
        "home":
          "$ref": "#/components/schemas/Team"
        "away":
          "$ref": "#/components/schemas/Team"
      "required":
        - "competition"
        - "home"
        - "away"
    "Season":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "number":
          "type": "integer"
          "minimum": 1
      "required":
        - "id"
        - "number"
    "Event":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "kind":
          "$ref": "#/components/schemas/EventKind"
        "title":
          "type": "string"
          "minLength": 1
        "contentId":
          "anyOf":
            -
              "type": "string"
              "format": "uuid"
            -
              "type": "null"
        "season":
          "anyOf":
            -
              "$ref": "#/components/schemas/Season"
            -
              "type": "null"
        "status":
          "$ref": "#/components/schemas/Status"
        "time":
          "$ref": "#/components/schemas/EventTime"
        "releaseMarket":
          "anyOf":
            -
              "type": "string"
              "pattern": "^([A-Z]{2}|WORLD)$"
            -
              "type": "null"
        "venueCountry":
          "anyOf":
            -
              "$ref": "#/components/schemas/Country"
            -
              "type": "null"
        "services":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Service"
          "uniqueItems": true
        "devices":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Device"
          "uniqueItems": true
        "match":
          "anyOf":
            -
              "$ref": "#/components/schemas/Match"
            -
              "type": "null"
        "dataOrigin":
          "type": "string"
          "enum":
            - "fixture"
            - "provider"
        "updatedAt":
          "type": "string"
          "format": "date-time"
          "pattern": "Z$"
          "description": "UTC RFC 3339, Z 접미사"
      "required":
        - "id"
        - "kind"
        - "title"
        - "contentId"
        - "season"
        - "status"
        - "time"
        - "releaseMarket"
        - "venueCountry"
        - "services"
        - "devices"
        - "match"
        - "dataOrigin"
        - "updatedAt"
      "allOf":
        -
          "if":
            "properties":
              "kind":
                "const": "epl_match"
            "required":
              - "kind"
          "then":
            "properties":
              "contentId":
                "type": "null"
              "releaseMarket":
                "type": "null"
              "match":
                "$ref": "#/components/schemas/Match"
          "else":
            "properties":
              "contentId":
                "type": "string"
                "format": "uuid"
              "match":
                "type": "null"
              "releaseMarket":
                "type": "string"
                "pattern": "^([A-Z]{2}|WORLD)$"
        -
          "if":
            "properties":
              "kind":
                "const": "ott_season_premiere"
            "required":
              - "kind"
          "then":
            "properties":
              "services":
                "minItems": 1
              "releaseMarket":
                "$ref": "#/components/schemas/Country"
          "else":
            "properties":
              "services":
                "maxItems": 0
              "season":
                "type": "null"
        -
          "if":
            "properties":
              "kind":
                "const": "game_release"
            "required":
              - "kind"
          "then":
            "properties":
              "devices":
                "minItems": 1
          "else":
            "properties":
              "devices":
                "maxItems": 0
    "SourceEvidence":
      "type": "object"
      "additionalProperties": false
      "properties":
        "providerKey":
          "type": "string"
        "url":
          "type": "string"
          "format": "uri"
        "observedAt":
          "type": "string"
          "format": "date-time"
          "pattern": "Z$"
          "description": "UTC RFC 3339, Z 접미사"
        "sourceUpdatedAt":
          "anyOf":
            -
              "type": "string"
              "format": "date-time"
              "pattern": "Z$"
              "description": "UTC RFC 3339, Z 접미사"
            -
              "type": "null"
      "required":
        - "providerKey"
        - "url"
        - "observedAt"
        - "sourceUpdatedAt"
      "description": "출처 URL은 공개 접근용만. 토큰/서명 쿼리 문자열 금지"
    "EventDetail":
      "type": "object"
      "additionalProperties": false
      "properties":
        "event":
          "$ref": "#/components/schemas/Event"
        "sources":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/SourceEvidence"
        "previousTime":
          "anyOf":
            -
              "$ref": "#/components/schemas/EventTime"
            -
              "type": "null"
      "required":
        - "event"
        - "sources"
        - "previousTime"
      "description": "previousTime은 현재 시간대 표현이며 마지막 유효 날짜/시각. 미정으로 연기된 경우 과거 배치 근거를 설명한다."
    "Content":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "kind":
          "type": "string"
          "enum":
            - "movie"
            - "drama"
            - "game"
        "title":
          "type": "string"
          "minLength": 1
        "originalTitle":
          "anyOf":
            -
              "type": "string"
            -
              "type": "null"
        "posterUrl":
          "anyOf":
            -
              "type": "string"
              "format": "uri"
            -
              "type": "null"
        "synopsis":
          "anyOf":
            -
              "type": "string"
            -
              "type": "null"
        "seasons":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Season"
      "required":
        - "id"
        - "kind"
        - "title"
        - "originalTitle"
        - "posterUrl"
        - "synopsis"
        - "seasons"
      "description": "OTT 회차 목록은 없다. 시즌 미상은 임의 시즌을 만들지 않고 Event.season=null로 반환"
    "Freshness":
      "type": "object"
      "additionalProperties": false
      "properties":
        "providerKey":
          "type": "string"
        "category":
          "$ref": "#/components/schemas/Category"
        "scopeCountry":
          "anyOf":
            -
              "$ref": "#/components/schemas/Country"
            -
              "type": "null"
        "coverage":
          "type": "string"
          "enum":
            - "unconfigured"
            - "unsupported"
            - "partial"
            - "available"
        "lastAttemptStatus":
          "type": "string"
          "enum":
            - "never"
            - "running"
            - "succeeded"
            - "failed"
        "lastAttemptAt":

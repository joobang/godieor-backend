        -
          "name": "limit"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 100
            "default": 50
        -
          "name": "cursor"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "minLength": 1

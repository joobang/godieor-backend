# 검토용 초안. 실행 구현/승인 결과가 아닙니다.
"openapi": "3.1.1"
"info":
  "title": "GODIEOR API 계약 초안"
  "version": "0.1.0-draft.1"
  "description": "SYS-02 / PROD-001~010. 정책 기반 설계 초안이며 서버/마이그레이션/정식 검증 미구현. 동작 세부는 README.md 참조."
"servers":
  -
    "url": "http://localhost:3000/v1"
    "description": "Mac 로컬 개발 예정. iPhone은 도달 가능한 Mac 주소 사용; 원격 인증은 HTTPS 필수."
"security": []
"paths":
  "/catalog/options":
    "get":
      "operationId": "getCatalogOptions"
      "summary": "필터 선택값·신규 계정 기본값"
      "security": []
      "responses":
        "200":
          "description": "성공"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Options"
        "400":
          "description": "잘못된 조건/토큰/날짜/지원하지 않는 시간대"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "headers":
            "Cache-Control":
              "schema":
                "const": "no-store"
              "description": "계정/세션 응답은 공유 캐시 금지"
        "429":
          "description": "요청 제한"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "headers":
            "Retry-After":
              "schema":
                "type": "integer"
                "minimum": 1
              "description": "다시 시도할 최소 초"
            "Cache-Control":
              "schema":
                "const": "no-store"
              "description": "계정/세션 응답은 공유 캐시 금지"
        "503":
          "description": "서비스/DB 사용 불가"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "headers":
            "Cache-Control":
              "schema":
                "const": "no-store"
              "description": "계정/세션 응답은 공유 캐시 금지"
  "/calendar":
    "get":
      "operationId": "getCalendar"
      "summary": "공개 월간 건수·날짜별 최대 두 미리보기"
      "security": []
      "responses":
        "200":
          "description": "성공"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Calendar"
        "400":
          "description": "잘못된 조건/토큰/날짜/지원하지 않는 시간대"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "headers":
            "Cache-Control":
              "schema":
                "const": "no-store"
              "description": "계정/세션 응답은 공유 캐시 금지"
        "409":
          "description": "카탈로그/찜/설정 버전 충돌"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "headers":
            "Cache-Control":
              "schema":
                "const": "no-store"
              "description": "계정/세션 응답은 공유 캐시 금지"
        "429":
          "description": "요청 제한"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "headers":
            "Retry-After":
              "schema":
                "type": "integer"
                "minimum": 1
              "description": "다시 시도할 최소 초"
            "Cache-Control":
              "schema":
                "const": "no-store"
              "description": "계정/세션 응답은 공유 캐시 금지"
        "503":
          "description": "서비스/DB 사용 불가"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "headers":
            "Cache-Control":
              "schema":
                "const": "no-store"
              "description": "계정/세션 응답은 공유 캐시 금지"
      "parameters":
        -
          "name": "country"
          "in": "query"
          "required": false
          "schema":
            "$ref": "#/components/schemas/Country"
            "default": "KR"
        -
          "name": "timeZone"
          "in": "query"
          "required": false
          "schema":
            "$ref": "#/components/schemas/TimeZone"
            "default": "Asia/Seoul"
        -
          "name": "categories"
          "in": "query"
          "required": false
          "schema":
            "type": "array"
            "items":
              "$ref": "#/components/schemas/Category"
            "uniqueItems": true
          "description": "쉼표 구분. 생략/빈 값=전체 네 분야. 앱은 활성 분야와 임시 필터의 교집합을 명시 전송. 모두 OFF일 때는 호출하지 않음."
          "style": "form"
          "explode": false
        -
          "name": "services"
          "in": "query"
          "required": false
          "schema":
            "type": "array"
            "items":
              "$ref": "#/components/schemas/Service"
            "uniqueItems": true
          "description": "OTT 분야 안에서 OR. 다른 분야를 숨기지 않음. 생략/빈 값=전체"
          "style": "form"
          "explode": false
        -
          "name": "devices"
          "in": "query"
          "required": false
          "schema":
            "type": "array"
            "items":
              "$ref": "#/components/schemas/Device"
            "uniqueItems": true
          "description": "게임 분야 안에서 OR. 다른 분야를 숨기지 않음. 생략/빈 값=전체"
          "style": "form"
          "explode": false
        -
          "name": "catalogRevision"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "pattern": "^[1-9][0-9]*$"
            "description": "64비트 카운터를 정밀도 손실 없이 전달하는 십진 문자열"
          "description": "최초 호출은 생략 가능. 달력→목록 및 연속 페이지는 같은 버전 요구. 변경 시 409 CATALOG_CHANGED"
        -
          "name": "month"
          "in": "query"
          "required": true
          "schema":
            "type": "string"
            "pattern": "^[0-9]{4}-(0[1-9]|1[0-2])$"
          "description": "2026-01 이상. 월 전체, 표시 시간대 기준"
  "/events":
    "get":
      "operationId": "listEvents"
      "summary": "공개 날짜별 또는 미정 일정 목록"
      "security": []
      "responses":
        "200":
          "description": "성공"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/EventPage"
        "400":
          "description": "잘못된 조건/토큰/날짜/지원하지 않는 시간대"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "headers":
            "Cache-Control":
              "schema":
                "const": "no-store"
              "description": "계정/세션 응답은 공유 캐시 금지"
        "409":
          "description": "카탈로그/찜/설정 버전 충돌"

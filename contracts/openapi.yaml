        "429":
          "description": "요청 제한"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "headers":
            "Retry-After":
              "schema":
                "type": "integer"
                "minimum": 1
              "description": "다시 시도할 최소 초"
            "Cache-Control":
              "schema":
                "const": "no-store"
              "description": "계정/세션 응답은 공유 캐시 금지"
        "503":
          "description": "서비스/DB 사용 불가"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "headers":
            "Cache-Control":
              "schema":
                "const": "no-store"
              "description": "계정/세션 응답은 공유 캐시 금지"
      "parameters":
        -
          "name": "country"
          "in": "query"
          "required": false
          "schema":
            "$ref": "#/components/schemas/Country"
            "default": "KR"
        -
          "name": "timeZone"
          "in": "query"
          "required": false
          "schema":
            "$ref": "#/components/schemas/TimeZone"
            "default": "Asia/Seoul"
        -
          "name": "categories"
          "in": "query"
          "required": false
          "schema":
            "type": "array"
            "items":
              "$ref": "#/components/schemas/Category"
            "uniqueItems": true
          "description": "쉼표 구분. 생략/빈 값=전체 네 분야. 앱은 활성 분야와 임시 필터의 교집합을 명시 전송. 모두 OFF일 때는 호출하지 않음."
          "style": "form"
          "explode": false
        -
          "name": "services"
          "in": "query"
          "required": false
          "schema":
            "type": "array"
            "items":
              "$ref": "#/components/schemas/Service"
            "uniqueItems": true
          "description": "OTT 분야 안에서 OR. 다른 분야를 숨기지 않음. 생략/빈 값=전체"
          "style": "form"
          "explode": false
        -
          "name": "devices"
          "in": "query"
          "required": false
          "schema":
            "type": "array"
            "items":
              "$ref": "#/components/schemas/Device"
            "uniqueItems": true
          "description": "게임 분야 안에서 OR. 다른 분야를 숨기지 않음. 생략/빈 값=전체"
          "style": "form"
          "explode": false
        -
          "name": "catalogRevision"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "pattern": "^[1-9][0-9]*$"
            "description": "64비트 카운터를 정밀도 손실 없이 전달하는 십진 문자열"
          "description": "최초 호출은 생략 가능. 달력→목록 및 연속 페이지는 같은 버전 요구. 변경 시 409 CATALOG_CHANGED"
        -
          "name": "schedule"
          "in": "query"
          "required": true
          "schema":
            "type": "string"
            "enum":
              - "dated"
              - "undated"
          "description": "dated에는 from/to 필요. undated에는 from/to 금지, unknown만 반환"
        -
          "name": "from"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "format": "date"
          "description": "선택 시간대의 포함 시작 날짜, 2026-01-01 이상"
        -
          "name": "to"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "format": "date"
          "description": "제외 끝 날짜. from보다 크고 최대 62일 폭. 미래 연도 상한 없음"
        -
          "name": "contentId"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "limit"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 100
            "default": 50
        -
          "name": "cursor"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "minLength": 1
          "description": "서명된 불투명 토큰. 정렬 위치·조건·버전·사용자 범위를 고정. 다른 조건에 재사용 불가"

services:
  - type: web
    name: godieor-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx prisma migrate deploy && node dist/src/main.js
    autoDeployTrigger: checksPass
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_VERSION
        value: 24.11.0
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: godieor-db
          property: connectionString
      - key: CURSOR_SIGNING_KEY
        generateValue: true
      - key: GOOGLE_IOS_CLIENT_ID
        sync: false
      - key: COLLECTION_SCHEDULE_ENABLED
        value: "false"
      - key: CATALOG_PROVIDER_ONLY
        value: "true"

databases:
  - name: godieor-db
    plan: free

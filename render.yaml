services:
  - type: web
    name: godieor-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx prisma migrate deploy && node dist/src/main.js
    autoDeployTrigger: checksPass
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.3
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: CURSOR_SIGNING_KEY
        generateValue: true
      - key: GOOGLE_IOS_CLIENT_ID
        sync: false
      # Disable in-process scheduling until deployment and external GitHub Actions scheduling are configured.
      - key: COLLECTION_SCHEDULE_ENABLED
        value: "false"
      # OTT requires a persistent review-state store, unavailable on Free.
      - key: COLLECTION_OTT_SCHEDULE_ENABLED
        value: "false"
      - key: COLLECTION_RETAIN_RECENT_ONLY
        value: "true"
      - key: COLLECTION_INCLUDE_FIXTURE
        value: "false"
      - key: KOBIS_API_KEY
        sync: false
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: IGDB_CLIENT_ID
        sync: false
      - key: IGDB_CLIENT_SECRET
        sync: false
      - key: TMDB_API_READ_ACCESS_TOKEN
        sync: false
      - key: CATALOG_PROVIDER_ONLY
        value: "true"

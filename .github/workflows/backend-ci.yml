name: Backend CI
on:
  pull_request:
  push:
    branches: [main, dev]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          # Prisma generate validates the URL. This suite does not connect to it.
          DATABASE_URL: postgresql://synthetic:synthetic@127.0.0.1:1/synthetic

name: Daily provider collection
on:
  schedule:
    # 08:30 Asia/Seoul (UTC+09:00); GitHub scheduled runs can be delayed.
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Daily refresh or initial backfill for KOBIS, EPL, IGDB and OTT"
        type: choice
        required: true
        default: daily
        options: [daily, backfill]
      backfill_target:
        description: "Backfill target (leave all in daily mode)"
        type: choice
        required: true
        default: all
        options: [all, kobis, epl, igdb, igdb-world, igdb-kr, igdb-jp, igdb-au, igdb-nz, igdb-cn, igdb-br, ott]
permissions:
  contents: read
concurrency:
  group: godieor-provider-collection
  cancel-in-progress: false
jobs:
  collect:
    # Keep scheduled writes opt-in when this workflow reaches the default branch.
    if: github.event_name != 'schedule' || vars.COLLECTION_SCHEDULE_ACTIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      DATABASE_URL: ${{ secrets.COLLECTION_DATABASE_URL }}
      CURSOR_SIGNING_KEY: ${{ secrets.COLLECTION_CURSOR_SIGNING_KEY }}
      KOBIS_API_KEY: ${{ secrets.KOBIS_API_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
      IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      SUPABASE_CA_PEM_BASE64: ${{ secrets.COLLECTION_SUPABASE_CA_PEM_BASE64 }}
      # Preserve one atomic scope publication across slower remote DB round trips.
      # Registration and run bookkeeping also cross the remote DB boundary.
      COLLECTION_CONTROL_TIMEOUT_MS: "60000"
      COLLECTION_PUBLISH_TIMEOUT_MS: "900000"
      COLLECTION_INCLUDE_FIXTURE: "false"
      COLLECTION_SCHEDULE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: npm
      - name: Resolve collection selection
        id: selection
        env:
          COLLECTION_MODE: ${{ inputs.mode }}
          BACKFILL_TARGET: ${{ inputs.backfill_target }}
        run: node scripts/plan-collection.mjs
      - name: Validate collection configuration
        run: node scripts/check-collection-env.mjs --scope common
      - name: Configure secure database connection
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo 'COLLECTION_DATABASE_URL secret is missing'; exit 1; }
          test -n "$CURSOR_SIGNING_KEY" || { echo 'COLLECTION_CURSOR_SIGNING_KEY secret is missing'; exit 1; }
          if [[ -n "$SUPABASE_CA_PEM_BASE64" ]]; then
            printf '%s' "$SUPABASE_CA_PEM_BASE64" | base64 --decode > "$RUNNER_TEMP/supabase-ca.pem"
            openssl x509 -in "$RUNNER_TEMP/supabase-ca.pem" -noout >/dev/null
            echo "NODE_EXTRA_CA_CERTS=$RUNNER_TEMP/supabase-ca.pem" >> "$GITHUB_ENV"
          fi
      - run: npm ci
      - run: npm run build
        id: build
      - name: Apply database migrations before collection
        run: npx prisma migrate deploy
      - name: Collect daily providers
        id: providers_daily
        continue-on-error: true
        if: steps.selection.outputs.daily == 'true'
        run: npm run collect:providers:daily
      - name: Backfill selected providers
        id: providers_backfill
        continue-on-error: true
        if: steps.selection.outputs.providers != ''
        env:
          BACKFILL_PROVIDERS: ${{ steps.selection.outputs.providers }}
          IGDB_BACKFILL_MARKET: ${{ steps.selection.outputs.market }}
        shell: bash
        run: |
          failed=0
          read -r -a providers <<< "$BACKFILL_PROVIDERS"
          for provider in "${providers[@]}"; do
            echo "::group::Backfill $provider"
            if node scripts/check-collection-env.mjs --scope "$provider"; then
              args=(--mode backfill --providers "$provider")
              if [[ "$provider" == igdb && -n "$IGDB_BACKFILL_MARKET" ]]; then
                args+=(--market "$IGDB_BACKFILL_MARKET")
              fi
              node --env-file-if-exists=.env dist/src/cli/collect-daily.js "${args[@]}" || failed=1
            else
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Restore reviewed OTT candidates
        id: restore_ott
        if: "!cancelled() && steps.build.outcome == 'success' && steps.selection.outputs.ott == 'true'"
        run: node scripts/restore-reviewed-ott-state.mjs
      - name: Collect and publish reviewed OTT premieres
        if: "!cancelled() && steps.restore_ott.outcome == 'success'"
        id: ott
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/run-official-ott-pipeline.mjs > "$RUNNER_TEMP/ott-pipeline-report.json"
          result=$?
          cat "$RUNNER_TEMP/ott-pipeline-report.json"
          if [[ "$result" -eq 2 ]]; then
            echo "::warning::OTT published with incomplete source discovery; inspect the report artifact"
            exit 0
          fi
          exit "$result"
      - name: Save OTT run evidence
        if: "!cancelled() && (steps.ott.outcome == 'success' || steps.ott.outcome == 'failure')"
        uses: actions/upload-artifact@v4
        with:
          name: ott-collection-report
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/ott-pipeline-report.json
            work/ott-official-daily-last-run.json
            work/tmdb-release-candidates/latest.json
            work/ott-candidates/state.json
            data/curated/ott-reviewed-mappings.json
      - name: Report overall collection failures
        if: always()
        shell: bash
        run: |
          echo "Daily provider result: ${{ steps.providers_daily.outcome }}"
          echo "Backfill provider result: ${{ steps.providers_backfill.outcome }}"
          echo "OTT result: ${{ steps.ott.outcome }}"
          [[ "${{ steps.providers_daily.outcome }}" != failure && "${{ steps.providers_backfill.outcome }}" != failure && "${{ steps.ott.outcome }}" != failure ]]

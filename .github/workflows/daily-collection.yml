name: Daily provider collection
on:
  schedule:
    # GitHub Actions schedules run in UTC; 21:00 UTC = 06:00 KST.
    - cron: "0 21 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: godieor-provider-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.COLLECTION_DATABASE_URL }}
      CURSOR_SIGNING_KEY: ${{ secrets.COLLECTION_CURSOR_SIGNING_KEY }}
      KOBIS_API_KEY: ${{ secrets.KOBIS_API_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
      IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
      COLLECTION_INCLUDE_FIXTURE: "false"
      COLLECTION_SCHEDULE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run collect:daily

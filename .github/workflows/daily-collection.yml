name: Daily provider collection
on:
  schedule:
    # 08:30 Asia/Seoul (UTC+09:00); GitHub scheduled runs can be delayed.
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Daily refresh or initial backfill for KOBIS, EPL, IGDB and OTT"
        type: choice
        required: true
        default: daily
        options: [daily, backfill]
permissions:
  contents: read
concurrency:
  group: godieor-provider-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      DATABASE_URL: ${{ secrets.COLLECTION_DATABASE_URL }}
      CURSOR_SIGNING_KEY: ${{ secrets.COLLECTION_CURSOR_SIGNING_KEY }}
      KOBIS_API_KEY: ${{ secrets.KOBIS_API_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
      IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      SUPABASE_CA_PEM_BASE64: ${{ secrets.COLLECTION_SUPABASE_CA_PEM_BASE64 }}
      COLLECTION_INCLUDE_FIXTURE: "false"
      COLLECTION_SCHEDULE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: npm
      - name: Configure secure database connection
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo 'COLLECTION_DATABASE_URL secret is missing'; exit 1; }
          test -n "$CURSOR_SIGNING_KEY" || { echo 'COLLECTION_CURSOR_SIGNING_KEY secret is missing'; exit 1; }
          if [[ -n "$SUPABASE_CA_PEM_BASE64" ]]; then
            printf '%s' "$SUPABASE_CA_PEM_BASE64" | base64 --decode > "$RUNNER_TEMP/supabase-ca.pem"
            openssl x509 -in "$RUNNER_TEMP/supabase-ca.pem" -noout >/dev/null
            echo "NODE_EXTRA_CA_CERTS=$RUNNER_TEMP/supabase-ca.pem" >> "$GITHUB_ENV"
          fi
      - run: npm ci
      - run: npm run build
      - name: Restore reviewed OTT candidates
        run: node scripts/restore-reviewed-ott-state.mjs
      - name: Collect daily providers
        id: providers_daily
        continue-on-error: true
        if: github.event_name == 'schedule' || inputs.mode == 'daily'
        run: npm run collect:providers:daily
      - name: Initial backfill for all providers
        id: providers_backfill
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill'
        shell: bash
        run: |
          failed=0
          for provider in kobis football_data_pl igdb; do
            echo "::group::Backfill $provider"
            node --env-file-if-exists=.env dist/src/cli/collect-daily.js --mode backfill --providers "$provider" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Collect and publish reviewed OTT premieres
        if: always() && (steps.providers_daily.outcome != 'skipped' || steps.providers_backfill.outcome != 'skipped')
        id: ott
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/run-official-ott-pipeline.mjs > "$RUNNER_TEMP/ott-pipeline-report.json"
          result=$?
          cat "$RUNNER_TEMP/ott-pipeline-report.json"
          if [[ "$result" -eq 2 ]]; then
            echo "::warning::OTT published with incomplete source discovery; inspect the report artifact"
            exit 0
          fi
          exit "$result"
      - name: Save OTT run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ott-collection-report
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/ott-pipeline-report.json
            work/ott-official-daily-last-run.json
            work/tmdb-release-candidates/latest.json
            work/ott-candidates/state.json
            data/curated/ott-reviewed-mappings.json
      - name: Report overall collection failures
        if: always()
        shell: bash
        run: |
          echo "Daily provider result: ${{ steps.providers_daily.outcome }}"
          echo "Backfill provider result: ${{ steps.providers_backfill.outcome }}"
          echo "OTT result: ${{ steps.ott.outcome }}"
          [[ "${{ steps.providers_daily.outcome }}" != failure && "${{ steps.providers_backfill.outcome }}" != failure && "${{ steps.ott.outcome }}" != failure ]]
